name: Feature debug build

# Clean, Android-Studio-free build of the Skylink Bingwa debug APK.
# Runs on feature/chore/fix/docs branches, on main, and on PRs to main.
# Debug only: no signing secrets are used or required here.

on:
  push:
    branches:
      - main
      - "feature/**"
      - "chore/**"
      - "fix/**"
      - "docs/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# A newer build for the same branch cancels an obsolete in-progress one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skylink-bingwa
    # Non-secret payment config baked into the debug APK. The URL + app-key point
    # the app at the cPanel payment API; NO Daraja credentials are here (those stay
    # on the server). If these repo secrets are unset, both are empty and the app
    # falls back to the built-in simulation.
    env:
      PAYMENTS_BASE_URL: ${{ secrets.PAYMENTS_BASE_URL }}
      PAYMENTS_APP_KEY: ${{ secrets.PAYMENTS_APP_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set short commit SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Configure google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      # Assemble first so the debug APK is produced and uploaded for phone
      # testing even if the quality gate below later fails the build.
      #
      # `direct` is the full-featured distribution flavor (keeps the local
      # Safaricom SMS delivery-detection that Google Play restricts), so its
      # debug variant is the right one to install on the physical test phone.
      # Debug still uses AGP's auto-generated debug keystore — NO release
      # signing secrets are referenced anywhere in this workflow.
      - name: Assemble direct debug APK
        run: ./gradlew assembleDirectDebug --stacktrace --no-daemon

      - name: Stage debug APK with commit-specific name
        if: success()
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/direct/debug/app-direct-debug.apk \
             "artifact/Skylink-Bingwa-Debug-${SHORT_SHA}.apk"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: skylink-bingwa-debug-${{ env.SHORT_SHA }}
          path: skylink-bingwa/artifact/Skylink-Bingwa-Debug-${{ env.SHORT_SHA }}.apk
          if-no-files-found: error
          retention-days: 14

      # Quality gate runs after the APK is captured. A failure here still marks
      # the build red (visible) but does not discard the uploaded debug APK.
      - name: Run unit tests and lint
        run: ./gradlew test lint --stacktrace --no-daemon

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skylink-bingwa-reports-${{ env.SHORT_SHA }}
          path: |
            skylink-bingwa/app/build/reports/**
            skylink-bingwa/app/build/test-results/**
          if-no-files-found: warn
          retention-days: 14
