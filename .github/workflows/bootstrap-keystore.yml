name: Bootstrap signing keystore (one-time)

# =============================================================================
#  RUN THIS EXACTLY ONCE. It generates the PERMANENT app-signing keystore.
# =============================================================================
#
#  Why this exists: the maintainer's PC has no local `keytool` (no JDK / Android
#  Studio), so the permanent upload key is generated here in CI instead.
#
#  What you must do AFTER a successful run:
#    1. Download the `my-upload-keystore-encrypted` artifact from this run. It
#       contains ONLY `my-upload-key.jks.gpg` — the keystore, symmetrically
#       encrypted with the `backup_passphrase` you supplied. The plaintext
#       keystore is NEVER uploaded or printed (CLAUDE.md §12.5).
#    2. Decrypt it locally:
#         gpg --decrypt --passphrase '<backup_passphrase>' \
#             -o my-upload-key.jks my-upload-key.jks.gpg
#    3. BACK UP `my-upload-key.jks` OFFLINE in at least two safe places
#       (e.g. an encrypted USB drive and a password manager / secure vault),
#       together with the store password, key password and alias. If this key
#       is lost you can NEVER publish another update to the same app — Google
#       Play and sideload updates both require this exact identity forever.
#    4. Base64-encode it and store it as the `KEYSTORE_BASE64` repo secret so
#       the release workflow can sign with it:
#         base64 -w0 my-upload-key.jks
#       (Copy the single-line output into the KEYSTORE_BASE64 secret.)
#    5. Confirm the STORE_PASSWORD, KEY_PASSWORD (and KEY_ALIAS if not `upload`)
#       repo secrets match what you used here.
#    6. Delete the downloaded artifact and any local plaintext copies you do not
#       intend to keep as a secured offline backup.
#
#  The artifact is retained for only 1 day — download it promptly.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: "Key alias inside the keystore."
        required: false
        default: "upload"
        type: string
      validity_days:
        description: "Certificate validity in days (10950 ~= 30 years)."
        required: false
        default: "10950"
        type: string
      dname:
        description: "X.500 distinguished name for the certificate."
        required: false
        default: "CN=Skylink Bingwa, O=Skylink Bingwa, C=KE"
        type: string
      backup_passphrase:
        description: "A strong passphrase you will need to decrypt the backup. Keep it safe — the encrypted keystore artifact cannot be opened without it."
        required: true
        type: string

# Read-only: this workflow never needs to write to the repository.
permissions:
  contents: read

jobs:
  bootstrap:
    name: Generate permanent keystore
    runs-on: ubuntu-latest

    steps:
      # temurin 17 gives us `keytool`.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Fail early with actionable guidance if the store/key passwords are not
      # configured yet — keytool would otherwise error less clearly.
      - name: Validate required secrets
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Set STORE_PASSWORD and KEY_PASSWORD (and optionally KEY_ALIAS) as repository secrets before running this workflow."
            exit 1
          fi

      # Generate the RSA-2048 keypair/keystore. -storepass/-keypass come from the
      # protected secrets so the passwords are never echoed into logs.
      - name: Generate keystore
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ inputs.key_alias }}
          VALIDITY: ${{ inputs.validity_days }}
          DNAME: ${{ inputs.dname }}
        run: |
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 \
            -validity "$VALIDITY" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "$DNAME"

      # The certificate fingerprints are PUBLIC information (Google Play needs the
      # SHA-256, for example). Printing them is safe; the private key is not shown.
      - name: Print certificate fingerprints (public, safe to share)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ inputs.key_alias }}
        run: |
          keytool -list -v \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      # SECURITY: the plaintext keystore must NEVER leave the runner. Encrypt it
      # symmetrically (AES-256) with the user-supplied passphrase and upload only
      # the encrypted blob. See CLAUDE.md §12.5.
      - name: Encrypt keystore for backup
        env:
          BACKUP_PASSPHRASE: ${{ inputs.backup_passphrase }}
        run: |
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" \
            -o my-upload-key.jks.gpg my-upload-key.jks

      # Upload ONLY the encrypted keystore. Never the plaintext .jks.
      - name: Upload encrypted keystore
        uses: actions/upload-artifact@v4
        with:
          name: my-upload-keystore-encrypted
          path: my-upload-key.jks.gpg
          if-no-files-found: error
          retention-days: 1

      # Always remove the plaintext keystore from the runner, even on failure.
      - name: Remove plaintext keystore
        if: always()
        run: rm -f my-upload-key.jks
