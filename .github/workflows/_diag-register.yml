name: _diag-register
# TEMPORARY diagnostic — not part of the normal pipeline. Confirms the
# PAYMENTS_APP_KEY baked into app builds actually matches what the live
# register_user.php endpoint expects, without ever printing the key itself.
# Deleted after use.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Call register_user.php with the real app key
        env:
          PAYMENTS_APP_KEY: ${{ secrets.PAYMENTS_APP_KEY }}
          PAYMENTS_BASE_URL: ${{ secrets.PAYMENTS_BASE_URL }}
        run: |
          BASE="${PAYMENTS_BASE_URL:-https://mybingwa.blazetechscope.com/}"
          echo "Base URL host (not the key): $(echo "$BASE" | sed -E 's#https?://([^/]+).*#\1#')"
          curl -s -o response.json -w "HTTP_STATUS:%{http_code}\n" -X POST "${BASE}register_user.php" \
            -H "Content-Type: application/json" \
            -H "X-App-Key: ${PAYMENTS_APP_KEY}" \
            -d '{"name":"CI Diagnostic","msisdn":"254700000000","appVersion":"ci-diag","fcm_token":"ci-diagnostic-token-do-not-use"}'
          echo "Response body:"
          cat response.json
